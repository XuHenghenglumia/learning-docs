<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>{{TITLE}}</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    .markdown-section table { display: table; width: 100%; font-size: 14px; }
    .markdown-section td, .markdown-section th { padding: 8px 10px; }
    blockquote { border-left: 4px solid #42b983; }
    .katex-display { overflow-x: auto; overflow-y: hidden; }
  </style>
</head>
<body>
  <div id="app">正在加载，请稍候…</div>
  <script>
    window.$docsify = {
      name: '{{TITLE}}',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 3,
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      },
      search: {
        paths: 'auto',
        placeholder: '搜索文档…',
        noData: '没有找到相关结果',
        depth: 3
      },
      auto2top: true,
      relativePath: true
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-c.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" defer></script>
  <script>
    // MathJax 公式支持：docsify 每次渲染完成后重新 typeset
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$']] },
      options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] },
      startup: { typeset: false }
    };
    function docsifyMathJax() {
      if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise();
      }
    }
    window.addEventListener('DOMContentLoaded', function () {
      var timer = setInterval(function () {
        if (window.Docsify) {
          clearInterval(timer);
          window.$docsify.plugins = [].concat(function (hook) {
            hook.doneEach(function () { setTimeout(docsifyMathJax, 100); });
          }, window.$docsify.plugins || []);
        }
      }, 50);
    });
  </script>
</body>
</html>
